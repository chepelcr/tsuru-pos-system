name: Deploy to GitHub Pages

# Builds the Tsuru POS SPA and deploys it to GitHub Pages at the custom domain
# app.tsuru.jcampos.dev (set via public/CNAME + repo Pages config).
# Replaces the old S3 + CloudFront deploy (the J-CAMPOS account is retired).
# Public VITE_* build params are inlined below (they are baked into the static
# bundle anyway — the Cognito client id is a public SPA identifier).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent production deploy; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_AWS_REGION: us-east-1
      VITE_AWS_COGNITO_USER_POOL_ID: us-east-1_0cTNJ31eo
      VITE_AWS_COGNITO_CLIENT_ID: 366o8d5l3fqpofd5igjplge3e0
      VITE_API_URL: https://api.tsuru.jcampos.dev
      VITE_ORDERS_API_URL: https://orders-api.tsuru.jcampos.dev
      VITE_SALES_API_URL: https://sales-api.tsuru.jcampos.dev
      VITE_DATA_API_URL: https://data-api.tsuru.jcampos.dev
      # VITE_APPSYNC_EVENTS_URL is resolved from SSM below, not inlined — see
      # the note on the "Resolve runtime config" step.
      VITE_BASE_DOMAIN: tsuru.jcampos.dev
      VITE_TEMPLATE_NAME: pos-system
      VITE_TEMPLATE_DISPLAY_NAME: Tsuru POS
      VITE_TEMPLATE_INDUSTRY: pos
      VITE_SINPE_NUMBER: 8888-8888
    permissions:
      contents: read
      # Mints the OIDC token for the role below. The Pages deploy job declares
      # its own id-token permission separately.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # ── Build configuration owned by a stack, read from that stack ─────────
      # The values above are literals because they are ours to choose. The
      # AppSync Events endpoint is not: it is an output of a CloudFormation
      # stack in another repo, and copying it here would mean two places to
      # change and one of them quietly going stale. It is published to
      # /tsuru/{env}/platform/* alongside the API URLs and Cognito ids, and read
      # from there with a role scoped to exactly that path
      # (cloudformation/deploy-role.yml).
      #
      # Soft-fail on purpose — but LOUDLY. An earlier version swallowed the
      # OIDC failure and shipped a POS with no real-time endpoint while the job
      # still showed green, so the failure paths below all emit a ::warning::
      # and the build's own log says which endpoint it compiled in.
      - name: Configure AWS credentials (OIDC)
        id: aws
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Warn when credentials are unavailable
        if: steps.aws.outcome != 'success'
        run: |
          echo "::warning::Could not assume the deploy role — building without \
          live notifications. Check the AWS_DEPLOY_ROLE_ARN secret and the role's \
          trust policy (cloudformation/deploy-role.yml)."

      - name: Resolve runtime config from SSM
        if: steps.aws.outcome == 'success'
        run: |
          set -o pipefail
          events_url=$(aws ssm get-parameter \
            --name "/tsuru/${ENVIRONMENT:-dev}/platform/appsync/events-url" \
            --query 'Parameter.Value' --output text 2>/dev/null || true)
          if [ -n "$events_url" ] && [ "$events_url" != "None" ]; then
            echo "VITE_APPSYNC_EVENTS_URL=$events_url" >> "$GITHUB_ENV"
            echo "Events endpoint: $events_url"
          else
            echo "::warning::/tsuru/${ENVIRONMENT:-dev}/platform/appsync/events-url \
            is missing or empty — building without live notifications."
          fi

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: |
          echo "Building with events endpoint: ${VITE_APPSYNC_EVENTS_URL:-<none>}"
          pnpm run build

      - name: SPA 404 fallback (client-side routing on GitHub Pages)
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
