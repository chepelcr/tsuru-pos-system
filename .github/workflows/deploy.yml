name: Deploy to GitHub Pages

# Builds the Tsuru POS SPA and deploys it to GitHub Pages at the custom domain
# app.tsuru.jcampos.dev (set via public/CNAME + repo Pages config).
# Replaces the old S3 + CloudFront deploy (the J-CAMPOS account is retired).
# Public VITE_* build params are inlined below (they are baked into the static
# bundle anyway — the Cognito client id is a public SPA identifier).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent production deploy; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_AWS_REGION: us-east-1
      # The API URLs, the Cognito ids and the events endpoint are NOT here.
      # They are infrastructure outputs, owned by CloudFormation stacks in
      # other repos, and they are resolved from SSM in the "Resolve build
      # configuration" step below. Only values this repo actually owns — its
      # own branding and the region — stay literal.
      VITE_BASE_DOMAIN: tsuru.jcampos.dev
      VITE_TEMPLATE_NAME: pos-system
      VITE_TEMPLATE_DISPLAY_NAME: Tsuru POS
      VITE_TEMPLATE_INDUSTRY: pos
      VITE_SINPE_NUMBER: 8888-8888
    permissions:
      contents: read
      # Mints the OIDC token for the role below. The Pages deploy job declares
      # its own id-token permission separately.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # ── Build configuration comes from the stacks that own it ─────────────
      # The API URLs, Cognito ids and events endpoint are CloudFormation
      # outputs published to /tsuru/{env}/platform/*. Copying them into this
      # workflow would mean two places to change and one of them quietly going
      # stale — which is exactly how a frontend ends up pointed at an endpoint
      # that moved. The role that reads them is scoped to that path alone
      # (cloudformation/deploy-role.yml).
      #
      # This step is NOT soft-fail. An earlier version let `continue-on-error`
      # swallow an OIDC failure and shipped a POS with no real-time endpoint
      # while the job showed green; now that the API URLs come from here too,
      # a config read that fails must stop the build rather than produce a
      # bundle pointed at nothing.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Resolve build configuration from SSM
        run: |
          set -euo pipefail
          env_name="${ENVIRONMENT:-dev}"
          base="/tsuru/${env_name}/platform"

          # One call for the whole namespace: adding a parameter later needs no
          # change here, only in the map below.
          params=$(aws ssm get-parameters-by-path --path "$base" --recursive \
            --query 'Parameters[].[Name,Value]' --output text)

          get() { echo "$params" | awk -F'\t' -v n="$base/$1" '$1==n {print $2; found=1} END {exit !found}'; }

          # Required — a bundle without these is not worth shipping.
          missing=0
          for pair in \
            "VITE_API_URL:api/url" \
            "VITE_ORDERS_API_URL:api/orders-url" \
            "VITE_SALES_API_URL:api/sales-url" \
            "VITE_DATA_API_URL:api/data-url" \
            "VITE_AWS_COGNITO_USER_POOL_ID:cognito/user-pool-id" \
            "VITE_AWS_COGNITO_CLIENT_ID:cognito/client-id"; do
            var="${pair%%:*}"; key="${pair#*:}"
            if value=$(get "$key"); then
              echo "${var}=${value}" >> "$GITHUB_ENV"
              echo "  ${var} <- ${base}/${key}"
            else
              echo "::error::Missing required parameter ${base}/${key}"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || {
            echo "::error::Build configuration incomplete — deploy the platform \
          params stack (monorepo deploys/deploy-params.sh)."
            exit 1
          }

          # The support control plane is deployed manually. Keep ordinary POS
          # releases buildable before its first rollout; a later build picks
          # up the SSM-owned URL automatically once the stack exists.
          if value=$(get "api/support-url"); then
            echo "VITE_SUPPORT_API_URL=${value}" >> "$GITHUB_ENV"
            echo "  VITE_SUPPORT_API_URL <- ${base}/api/support-url"
          else
            echo "VITE_SUPPORT_API_URL=https://support.tsuru.jcampos.dev" >> "$GITHUB_ENV"
            echo "::warning::No ${base}/api/support-url — using the support API custom-domain target."
          fi

          # Optional — without it the bell still lists what its hydrate loaded,
          # it just stops updating live. Not worth failing a release over.
          if value=$(get "appsync/events-url"); then
            echo "VITE_APPSYNC_EVENTS_URL=${value}" >> "$GITHUB_ENV"
            echo "  VITE_APPSYNC_EVENTS_URL <- ${base}/appsync/events-url"
          else
            echo "::warning::No ${base}/appsync/events-url — building without live notifications."
          fi

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: |
          echo "API      : ${VITE_API_URL}"
          echo "Orders   : ${VITE_ORDERS_API_URL}"
          echo "Sales    : ${VITE_SALES_API_URL}"
          echo "Data     : ${VITE_DATA_API_URL}"
          echo "Support  : ${VITE_SUPPORT_API_URL}"
          echo "Events   : ${VITE_APPSYNC_EVENTS_URL:-<none>}"
          pnpm run build

      - name: SPA 404 fallback (client-side routing on GitHub Pages)
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
