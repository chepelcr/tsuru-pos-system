name: Deploy to GitHub Pages

# Builds the Tsuru POS SPA and deploys it to GitHub Pages at the custom domain
# app.tsuru.jcampos.dev (set via public/CNAME + repo Pages config).
# Replaces the old S3 + CloudFront deploy (the J-CAMPOS account is retired).
# Public VITE_* build params are inlined below (they are baked into the static
# bundle anyway — the Cognito client id is a public SPA identifier).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent production deploy; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_AWS_REGION: us-east-1
      VITE_AWS_COGNITO_USER_POOL_ID: us-east-1_0cTNJ31eo
      VITE_AWS_COGNITO_CLIENT_ID: 366o8d5l3fqpofd5igjplge3e0
      VITE_API_URL: https://api.tsuru.jcampos.dev
      VITE_ORDERS_API_URL: https://orders-api.tsuru.jcampos.dev
      VITE_SALES_API_URL: https://sales-api.tsuru.jcampos.dev
      VITE_DATA_API_URL: https://data-api.tsuru.jcampos.dev
      # AppSync Events API — real-time notifications. A literal like every
      # other value here, and for the same reason: it is a constant. That is
      # the whole point of giving the Events API a custom domain instead of
      # using its generated 26-character hostname — the hash would change if
      # the API were ever recreated, the name will not.
      #
      # It is also published at /tsuru/{env}/platform/appsync/events-url for
      # consumers that resolve config at runtime. This build does not read it
      # from there: fetching a constant would mean giving a public repo's CI an
      # assumable AWS role, which is a real security surface to take on in
      # exchange for nothing. Empty builds a POS whose bell works but does not
      # update live.
      VITE_APPSYNC_EVENTS_URL: https://events.tsuru.jcampos.dev/event
      VITE_BASE_DOMAIN: tsuru.jcampos.dev
      VITE_TEMPLATE_NAME: pos-system
      VITE_TEMPLATE_DISPLAY_NAME: Tsuru POS
      VITE_TEMPLATE_INDUSTRY: pos
      VITE_SINPE_NUMBER: 8888-8888
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: SPA 404 fallback (client-side routing on GitHub Pages)
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
