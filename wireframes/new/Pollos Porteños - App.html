<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pollos Porteños — POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="screens/hub.jsx"></script>
<script type="text/babel" src="screens/pos-cajero.jsx"></script>
<script type="text/babel" src="screens/apertura.jsx"></script>
<script type="text/babel" src="screens/cierre.jsx"></script>
<script type="text/babel" src="screens/dashboard.jsx"></script>
<script type="text/babel" src="screens/dashboard-mobile.jsx"></script>
<script type="text/babel" src="screens/config-sesion.jsx"></script>
<script type="text/babel" src="screens/productos.jsx"></script>
<script type="text/babel" src="screens/reporte.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

const TWEAKS = /*EDITMODE-BEGIN*/{
  "theme": "light",
  "density": "comfortable"
}/*EDITMODE-END*/;

function App() {
  const [screen, setScreen] = usePersistedState("pp_screen_v2", "hub");
  const [theme, setTheme] = useState(TWEAKS.theme);
  const [showTweaks, setShowTweaks] = useState(false);

  useEffect(() => {
    document.documentElement.classList.toggle("dark", theme === "dark");
  }, [theme]);

  useEffect(() => {
    const h = (e) => {
      if (e.data?.type === "__activate_edit_mode") setShowTweaks(true);
      if (e.data?.type === "__deactivate_edit_mode") setShowTweaks(false);
    };
    window.addEventListener("message", h);
    window.parent.postMessage({ type: "__edit_mode_available" }, "*");
    return () => window.removeEventListener("message", h);
  }, []);

  const persist = (edits) => window.parent.postMessage({ type: "__edit_mode_set_keys", edits }, "*");
  const back = () => setScreen("hub");

  const screenProps = { onExit: back, onNav: setScreen };
  let view;
  switch (screen) {
    case "pos": view = <POSCajero {...screenProps} />; break;
    case "apertura": view = <InventarioApertura {...screenProps} onDone={() => setScreen("pos")} />; break;
    case "cierre": view = <CierreCaja {...screenProps} />; break;
    case "dashboard": view = <DashboardDesktop {...screenProps} />; break;
    case "dashmobile": view = <DashboardMobile {...screenProps} />; break;
    case "config": view = <ConfigSesion {...screenProps} />; break;
    case "productos": view = <Productos {...screenProps} />; break;
    case "reporte": view = <ReportePartido {...screenProps} />; break;
    default: view = <Hub onNav={setScreen} />;
  }

  return <>
    {view}
    <TweaksPanel {...{showTweaks, theme, setTheme, persist}} />
  </>;
}

function TweaksPanel({ showTweaks, theme, setTheme, persist }) {
  if (!showTweaks) return null;
  return (
    <div className="fade-up" style={{ position: "fixed", bottom: 20, right: 20, zIndex: 200, width: 280 }}>
      <div className="card shadow-pop" style={{ padding: 16 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <Icon name="sliders" size={14} style={{ color: "hsl(var(--primary))" }} />
            <div className="t-h4">Tweaks</div>
          </div>
        </div>
        <div className="t-label" style={{ marginBottom: 8 }}>Tema</div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 6 }}>
          {[{ id: "light", icon: "sun", label: "Claro" }, { id: "dark", icon: "moon", label: "Oscuro" }].map(t => (
            <button key={t.id} onClick={() => { setTheme(t.id); persist({ theme: t.id }); }}
              className={theme === t.id ? "btn btn-primary btn-sm" : "btn btn-outline btn-sm"}>
              <Icon name={t.icon} size={14} /> {t.label}
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
